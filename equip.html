<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipaggiamento - Deckbuilder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Kalam:wght@400;700&family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #0a0a1a;
    --ink-deep: #05050f;
    --moon: #c8e0f0;
    --moon-bright: #e8f4ff;
    --moon-shadow: #5a7a9a;
    --magenta: #d84080;
    --gold: #d8a840;
    --gold-light: #f0c870;
    --rarity-common: #8a9bb5;
    --rarity-rare: #5db9ff;
    --rarity-epic: #d070e0;
    --rarity-legendary: #f0a840;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
    font-family: 'IM Fell English', serif;
    color: var(--moon-bright);
    background: radial-gradient(ellipse at 50% 50%, #2a2a5a 0%, #1a1a3a 40%, #0a0a1a 100%);
    padding: 20px;
    overflow-y: auto;
    position: relative;
}

.bg-loop {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
}

body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(10,10,26,0) 0%, rgba(10,10,26,0.15) 55%, rgba(10,10,26,0.75) 100%);
    z-index: 1;
    pointer-events: none;
}

.test-bar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 200; flex-wrap: wrap; justify-content: center;
    transition: filter 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.test-btn {
    font-family: 'IM Fell English SC', serif; font-size: 13px; letter-spacing: 1px;
    color: var(--moon-bright);
    background: linear-gradient(135deg, #2a2a4a 0%, #1a1a3a 50%, #0f0f28 100%);
    border: 3px solid var(--ink); cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink), 0 10px 20px rgba(0,0,0,0.5);
    padding: 10px 18px; border-radius: 10px;
    transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    text-shadow: 2px 2px 0 var(--ink), 0 0 8px rgba(168,213,240,0.4);
}
.test-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 5px 5px 0 var(--ink), 0 15px 28px rgba(0,0,0,0.6), 0 0 22px rgba(168,213,240,0.4);
}
.test-btn.legendary {
    border-color: var(--rarity-legendary);
    color: var(--gold-light);
    box-shadow: 4px 4px 0 var(--ink), 0 0 20px rgba(240,168,64,0.5);
}
.test-btn.back-btn {
    border-color: var(--moon);
    color: var(--moon-bright);
    box-shadow: 4px 4px 0 var(--ink), 0 0 20px rgba(168, 213, 240, 0.5);
}

.dim-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
body.stat-highlight .dim-overlay { opacity: 1; transition: opacity 0.35s ease; }
body.stat-highlight .test-bar { filter: brightness(0.3) saturate(0.5); transition: filter 0.35s ease; }

.dual-panels {
    display: flex; gap: 28px;
    justify-content: center; align-items: stretch;
    padding-top: 80px; padding-bottom: 40px;
    min-height: 100vh;
    position: relative; z-index: 2;
    flex-wrap: wrap;
    transition: z-index 0s;
}
body.stat-highlight .dual-panels { z-index: 60; }

.panel {
    position: relative;
    background:
        radial-gradient(ellipse 40% 25% at 78% 18%, rgba(0,0,0,0.5), transparent 70%),
        radial-gradient(ellipse 35% 30% at 20% 78%, rgba(0,0,0,0.4), transparent 70%),
        linear-gradient(135deg, #2a2a4a 0%, #1a1a3a 50%, #0f0f28 100%);
    border-radius: 16px;
    border: 3px solid var(--ink);
    box-shadow:
        5px 5px 0 var(--ink),
        0 20px 40px rgba(0,0,0,0.7),
        inset 0 0 0 2px rgba(168, 213, 240, 0.12),
        inset 0 0 0 4px rgba(5, 5, 15, 0.6),
        inset 0 0 60px rgba(0, 0, 0, 0.9);
    padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
    transition:
        filter 0.9s cubic-bezier(0.25, 0.8, 0.25, 1),
        background 0.9s cubic-bezier(0.25, 0.8, 0.25, 1),
        border-color 0.9s cubic-bezier(0.25, 0.8, 0.25, 1),
        box-shadow 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.panel.equipment { width: 520px; }
.panel.bag { width: 520px; }

body.stat-highlight .panel.equipment {
    background: linear-gradient(135deg, #05050f 0%, #0a0a1a 50%, #05050f 100%);
    border-color: #05050f;
    transition:
        filter 0.35s ease, background 0.35s ease,
        border-color 0.35s ease, box-shadow 0.35s ease;
}
body.stat-highlight .panel.bag {
    filter: brightness(0.12) saturate(0.4);
    transition: filter 0.35s ease;
}

.panel .corner {
    position: absolute; width: 11px; height: 11px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6a6a7a 0%, #2a2a3a 60%, #0a0a15 100%);
    box-shadow:
        inset -1px -1px 2px rgba(0,0,0,0.8),
        inset 1px 1px 2px rgba(255,255,255,0.18),
        0 1px 3px rgba(0,0,0,0.9);
    z-index: 5; pointer-events: none;
    transition: filter 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.panel .corner.tl { top: 7px; left: 7px; }
.panel .corner.tr { top: 7px; right: 7px; }
.panel .corner.bl { bottom: 7px; left: 7px; }
.panel .corner.br { bottom: 7px; right: 7px; }
body.stat-highlight .panel.equipment > .corner { filter: brightness(0.15); transition: filter 0.35s ease; }

.panel-header {
    font-family: 'Cinzel', serif; font-size: 17px; font-weight: 900;
    letter-spacing: 5px; text-transform: uppercase;
    color: var(--moon-bright);
    text-align: center;
    padding: 4px 0 12px;
    border-bottom: 2px solid rgba(168,213,240,0.2);
    text-shadow: 2px 2px 0 var(--ink), 1px 1px 0 var(--ink), 0 0 15px rgba(216,64,128,0.5);
    position: relative; flex-shrink: 0;
    transition: filter 0.9s cubic-bezier(0.25, 0.8, 0.25, 1), border-bottom-color 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
body.stat-highlight .panel.equipment .panel-header {
    filter: brightness(0.15);
    border-bottom-color: rgba(50, 60, 80, 0.2);
    transition: filter 0.35s ease, border-bottom-color 0.35s ease;
}

.equip-layout {
    display: grid;
    grid-template-columns: 130px 1fr 130px;
    grid-template-rows: repeat(4, 130px);
    gap: 10px;
    flex-shrink: 0;
    overflow: hidden;
    padding: 2px;
}

.slot {
    position: relative;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: linear-gradient(145deg, rgba(26,26,58,0.85), rgba(15,15,40,0.95));
    box-shadow: 2px 2px 0 var(--ink), inset 0 2px 5px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.7);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden;
    padding: 4px; gap: 2px;
    transition:
        background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease,
        transform 0.3s ease,
        filter 0.9s cubic-bezier(0.25, 0.8, 0.25, 1),
        opacity 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
body.stat-highlight .slot {
    transition:
        background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease,
        transform 0.3s ease, filter 0.35s ease, opacity 0.35s ease;
}
.slot:hover {
    border-color: var(--moon);
    background: linear-gradient(145deg, rgba(42,42,74,0.9), rgba(26,26,58,0.95));
}
.slot.filled {
    border-color: var(--rarity, var(--moon));
    background:
        radial-gradient(ellipse 60% 40% at 50% 50%, var(--rarity-glow, rgba(122,216,255,0.15)), transparent 70%),
        linear-gradient(145deg, rgba(42,42,74,0.85), rgba(15,15,40,0.95));
    box-shadow: 2px 2px 0 var(--ink), inset 0 2px 5px rgba(0,0,0,0.7), 0 0 12px var(--rarity-glow, rgba(168,213,240,0.3));
}
.slot.filled.rarity-leggendario { animation: legendary-glow 2.5s ease-in-out infinite; }
@keyframes legendary-glow {
    0%, 100% { box-shadow: 2px 2px 0 var(--ink), 0 0 12px rgba(240,168,64,0.5); }
    50% { box-shadow: 2px 2px 0 var(--ink), 0 0 25px rgba(240,168,64,0.9); }
}
body.stat-highlight .panel.equipment .slot:not(.bonus-source) { filter: brightness(0.12) saturate(0.3); }
body.stat-highlight .slot.bonus-source {
    z-index: 30;
    filter: brightness(1.05) saturate(1.05) !important;
    transform: scale(1.03);
    border-color: var(--rarity, var(--moon-bright));
    box-shadow:
        2px 2px 0 var(--ink),
        0 0 10px var(--rarity-glow, rgba(232, 244, 255, 0.5)),
        inset 0 0 15px rgba(255, 255, 255, 0.08) !important;
    animation: none !important;
}
body.stat-highlight .slot.bonus-source .slot-icon {
    filter: drop-shadow(2px 2px 0 var(--ink)) drop-shadow(0 0 8px var(--rarity-glow, rgba(232, 244, 255, 0.7)));
    transform: scale(1.05); opacity: 1;
}

.slot-icon {
    font-size: 44px; line-height: 1;
    filter:
        grayscale(1) brightness(0.12) contrast(1.8)
        sepia(0.6) hue-rotate(180deg) saturate(0.5)
        drop-shadow(0 0 2px rgba(90, 122, 154, 0.35))
        drop-shadow(0 0 5px rgba(90, 122, 154, 0.15));
    opacity: 0.7;
    transition:
        filter 0.9s cubic-bezier(0.25, 0.8, 0.25, 1),
        transform 0.4s ease,
        opacity 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
body.stat-highlight .slot-icon { transition: filter 0.35s ease, transform 0.4s ease, opacity 0.35s ease; }
.slot.filled .slot-icon {
    filter: drop-shadow(2px 2px 0 var(--ink)) drop-shadow(0 0 12px var(--rarity-glow));
    opacity: 1; text-shadow: 2px 2px 0 var(--ink);
}

.slot-label {
    font-family: 'IM Fell English SC', serif; font-size: 9px;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--moon-shadow); text-shadow: 1px 1px 0 var(--ink);
    text-align: center; line-height: 1; pointer-events: none;
    white-space: nowrap; opacity: 0.4;
}
.slot.filled .slot-label { display: none; }

.slot-item-name {
    position: absolute; bottom: 3px; left: 3px; right: 3px;
    text-align: center; font-family: 'Kalam', cursive;
    font-size: 9px; font-weight: 700; color: var(--moon-bright);
    text-shadow: 1px 1px 0 var(--ink);
    pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: none;
}
.slot.filled .slot-item-name { display: block; }

/* SILHOUETTE */
.silhouette-area {
    grid-column: 2; grid-row: 1 / 5;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(168,213,240,0.18);
    border-radius: 10px;
    background:
        radial-gradient(ellipse 60% 50% at 50% 45%, rgba(122,216,255,0.08), transparent 70%),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(216,64,128,0.1), transparent 70%),
        linear-gradient(180deg, rgba(5,5,15,0.6), rgba(10,10,26,0.9));
    box-shadow: inset 0 4px 12px rgba(0,0,0,0.9), inset 0 0 60px rgba(0,0,0,0.8);
    overflow: hidden;
    transition: filter 0.9s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
body.stat-highlight .panel.equipment .silhouette-area {
    filter: brightness(0.12);
    border-color: rgba(50, 60, 80, 0.15);
    transition: filter 0.35s ease, border-color 0.35s ease;
}

#avatar-canvas {
    display: block;
    min-width: 0;
    min-height: 0;
    max-width: 80%;
    max-height: 92%;
    width: auto; height: auto;
    position: relative;
    z-index: 2;
    filter:
        drop-shadow(0 0 15px rgba(168, 213, 240, 0.4))
        drop-shadow(0 0 30px rgba(216, 64, 128, 0.25));
    animation: avatar-breathe 5s ease-in-out infinite;
}
@keyframes avatar-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.008); }
}

.avatar-aura {
    position: absolute; inset: 8%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 55%,
        rgba(168, 213, 240, 0.18) 0%,
        rgba(122, 74, 170, 0.12) 30%,
        transparent 65%);
    filter: blur(20px); z-index: 1;
    pointer-events: none;
    animation: aura-pulse-slow 6s ease-in-out infinite;
}
@keyframes aura-pulse-slow {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
}

.avatar-shadow {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    width: 60%; height: 10px;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.7) 0%, transparent 70%);
    filter: blur(6px); z-index: 1;
    pointer-events: none;
}

.silhouette-area::before, .silhouette-area::after {
    content: '';
    position: absolute;
    width: 30px; height: 30px;
    border: 2px solid var(--gold);
    opacity: 0.3; pointer-events: none; z-index: 3;
}
.silhouette-area::before {
    top: 8px; left: 8px;
    border-right: none; border-bottom: none;
    border-top-left-radius: 6px;
}
.silhouette-area::after {
    bottom: 8px; right: 8px;
    border-left: none; border-top: none;
    border-bottom-right-radius: 6px;
}

.avatar-rune {
    position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Cinzel', serif; font-size: 12px;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(216, 168, 64, 0.8), 0 0 20px rgba(216, 168, 64, 0.4);
    letter-spacing: 8px; z-index: 3; opacity: 0.7;
    pointer-events: none;
}

.slot[data-slot="head"]     { grid-column: 1; grid-row: 1; }
.slot[data-slot="amulet"]   { grid-column: 1; grid-row: 2; }
.slot[data-slot="ring"]     { grid-column: 1; grid-row: 3; }
.slot[data-slot="shield"]   { grid-column: 1; grid-row: 4; }
.slot[data-slot="chest"]    { grid-column: 3; grid-row: 1; }
.slot[data-slot="necklace"] { grid-column: 3; grid-row: 2; }
.slot[data-slot="pet"]      { grid-column: 3; grid-row: 3; }
.slot[data-slot="weapon"]   { grid-column: 3; grid-row: 4; }

.bag-wrapper {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 4px 6px 4px 2px;
}
.bag-wrapper::-webkit-scrollbar { width: 10px; }
.bag-wrapper::-webkit-scrollbar-track {
    background: rgba(5, 5, 15, 0.6);
    border-radius: 5px;
    border: 1px solid rgba(168,213,240,0.1);
}
.bag-wrapper::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(168,213,240,0.4), rgba(90,122,154,0.6));
    border-radius: 5px;
    border: 1px solid var(--ink);
    box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
}

.bag-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
}
.bag-slot {
    position: relative; aspect-ratio: 1;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: linear-gradient(145deg, rgba(26,26,58,0.85), rgba(15,15,40,0.95));
    box-shadow: 2px 2px 0 var(--ink), inset 0 2px 5px rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s ease;
    font-size: 26px; color: var(--moon-shadow);
    text-shadow: 2px 2px 0 var(--ink);
}
.bag-slot:hover { border-color: var(--moon); transform: translateY(-2px); }
.bag-slot.filled {
    border-color: var(--rarity, var(--moon));
    background:
        radial-gradient(ellipse 60% 40% at 50% 50%, var(--rarity-glow, rgba(122,216,255,0.15)), transparent 70%),
        linear-gradient(145deg, rgba(42,42,74,0.85), rgba(15,15,40,0.95));
    color: var(--moon-bright);
    text-shadow: 2px 2px 0 var(--ink), 0 0 10px var(--rarity-glow);
    box-shadow: 2px 2px 0 var(--ink), inset 0 2px 5px rgba(0,0,0,0.7), 0 0 10px var(--rarity-glow);
}
.bag-slot.filled.rarity-leggendario { animation: legendary-glow-bag 2.5s ease-in-out infinite; }
@keyframes legendary-glow-bag {
    0%, 100% { box-shadow: 2px 2px 0 var(--ink), 0 0 10px rgba(240,168,64,0.5); }
    50% { box-shadow: 2px 2px 0 var(--ink), 0 0 20px rgba(240,168,64,0.9); }
}

.bag-counter {
    font-family: 'Cinzel', serif; font-size: 11px; font-weight: 900;
    letter-spacing: 2px; color: var(--moon-shadow);
    text-align: center; text-shadow: 1px 1px 0 var(--ink);
    padding-top: 8px;
    border-top: 2px solid rgba(168,213,240,0.15);
    flex-shrink: 0;
}
.bag-counter .value {
    color: var(--moon-bright);
    text-shadow: 1px 1px 0 var(--ink), 0 0 6px rgba(168,213,240,0.4);
}

.stats-summary {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px 4px 4px;
    border-top: 2px solid rgba(168,213,240,0.15);
    flex-shrink: 0; position: relative; z-index: 10;
    transition: border-top-color 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
body.stat-highlight .panel.equipment .stats-summary {
    border-top-color: rgba(50, 60, 80, 0.2);
    transition: border-top-color 0.35s ease;
}
.stat-row {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px;
    border: 2px solid var(--ink); border-radius: 8px;
    background:
        radial-gradient(ellipse 80% 100% at 0% 50%, rgba(122, 216, 255, 0.04), transparent 70%),
        linear-gradient(90deg, rgba(5, 5, 15, 0.7), rgba(15, 15, 40, 0.5));
    cursor: help; position: relative;
    transition:
        border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease,
        transform 0.25s ease,
        filter 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
body.stat-highlight .panel.equipment .stat-row {
    transition:
        border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease,
        transform 0.25s ease, filter 0.35s ease;
}
body.stat-highlight .panel.equipment .stat-row:not(:hover) { filter: brightness(0.15) saturate(0.3); }
.stat-row:hover {
    z-index: 40;
    border-color: var(--moon);
    background:
        radial-gradient(ellipse 80% 100% at 0% 50%, rgba(122, 216, 255, 0.12), transparent 70%),
        linear-gradient(90deg, rgba(26, 26, 58, 0.95), rgba(15, 15, 40, 0.85));
    box-shadow: 0 0 15px rgba(168, 213, 240, 0.4), inset 0 1px 0 rgba(168, 213, 240, 0.2);
    transform: translateX(3px); filter: brightness(1) !important;
}
.stat-row .stat-icon { font-size: 22px; line-height: 1; flex-shrink: 0; filter: drop-shadow(0 0 6px rgba(168, 213, 240, 0.4)); }
.stat-row .stat-value {
    font-family: 'Cinzel', serif; font-size: 17px; font-weight: 900;
    color: var(--moon-bright); min-width: 42px; text-align: right;
    text-shadow: 1px 1px 0 var(--ink), 0 0 10px rgba(168, 213, 240, 0.6);
    flex-shrink: 0;
}
.stat-row .stat-label {
    font-family: 'Kalam', cursive; font-size: 13.5px; line-height: 1.3;
    color: var(--moon); text-shadow: 1px 1px 0 var(--ink); flex: 1;
}
.stat-row .stat-label b {
    color: var(--moon-bright); font-weight: 700;
    text-shadow: 1px 1px 0 var(--ink), 0 0 6px rgba(168, 213, 240, 0.5);
}
.stat-empty {
    font-family: 'IM Fell English', serif; font-style: italic; font-size: 13px;
    color: var(--moon-shadow); text-align: center;
    padding: 14px 20px; text-shadow: 1px 1px 0 var(--ink);
    opacity: 0.6;
    border: 2px dashed rgba(168, 213, 240, 0.15);
    border-radius: 8px;
}

/* MODAL DROP */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(12px);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000; opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease; padding: 20px;
    overflow: hidden;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.drop-stage {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; max-width: 700px;
    min-height: 100vh; padding: 40px 20px;
}
.drop-title {
    font-family: 'Cinzel', serif; font-size: 34px; font-weight: 900;
    letter-spacing: 8px; text-transform: uppercase;
    color: var(--gold-light);
    text-shadow: 3px 3px 0 var(--ink), 1px 1px 0 var(--ink),
        0 0 25px rgba(216,168,64,0.9), 0 0 50px rgba(216,168,64,0.5);
    margin-bottom: 12px;
    animation: title-glow 2.5s ease-in-out infinite;
    position: relative; z-index: 3;
}
@keyframes title-glow {
    0%, 100% { text-shadow: 3px 3px 0 var(--ink), 1px 1px 0 var(--ink), 0 0 25px rgba(216,168,64,0.9), 0 0 50px rgba(216,168,64,0.5); }
    50% { text-shadow: 3px 3px 0 var(--ink), 1px 1px 0 var(--ink), 0 0 40px rgba(216,168,64,1), 0 0 80px rgba(216,168,64,0.8); }
}
.drop-subtitle {
    font-family: 'IM Fell English', serif; font-style: italic; font-size: 16px;
    color: var(--moon-shadow); text-shadow: 1px 1px 0 var(--ink);
    margin-bottom: 40px; position: relative; z-index: 3;
}
.drop-emoji-wrap {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 280px; height: 280px; margin-bottom: 32px;
    z-index: 3;
}
.drop-emoji-wrap::before {
    content: '';
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--rarity-glow) 0%, transparent 65%);
    filter: blur(20px);
    animation: aura-pulse 3s ease-in-out infinite;
    z-index: 1;
}
@keyframes aura-pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.15); opacity: 1; }
}
.drop-emoji-wrap::after {
    content: '';
    position: absolute; inset: 15px; border-radius: 50%;
    border: 2px solid var(--rarity, var(--moon));
    opacity: 0.4;
    animation: ring-spin 12s linear infinite;
    box-shadow: inset 0 0 30px var(--rarity-glow), 0 0 30px var(--rarity-glow);
    z-index: 1;
}
@keyframes ring-spin {
    0% { transform: rotate(0deg) scale(1); opacity: 0.3; }
    50% { transform: rotate(180deg) scale(1.05); opacity: 0.6; }
    100% { transform: rotate(360deg) scale(1); opacity: 0.3; }
}
.drop-emoji {
    font-size: 200px; line-height: 1;
    position: relative; z-index: 2;
    filter: drop-shadow(0 0 30px var(--rarity-glow)) drop-shadow(0 0 60px var(--rarity-glow));
    animation: item-drop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transform-origin: center bottom;
}
@keyframes item-drop {
    0% { transform: translateY(-120vh) scale(0.4) rotate(-25deg); opacity: 0; }
    30% { transform: translateY(-20px) scale(1) rotate(8deg); opacity: 1; }
    45% { transform: translateY(0) scale(1.15) rotate(-5deg); }
    55% { transform: translateY(-30px) scale(1.05) rotate(3deg); }
    70% { transform: translateY(0) scale(1) rotate(-2deg); }
    80% { transform: translateY(-8px) scale(1.02) rotate(1deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
}
.drop-impact {
    position: absolute; width: 0; height: 0; border-radius: 50%;
    border: 4px solid var(--rarity, var(--moon));
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 2; opacity: 0;
    animation: impact-wave 1.2s ease-out 0.35s forwards;
}
@keyframes impact-wave {
    0% { width: 0; height: 0; opacity: 0.9; border-width: 6px; }
    100% { width: 500px; height: 500px; opacity: 0; border-width: 1px; }
}
.drop-particles { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.drop-particle {
    position: absolute; top: 50%; left: 50%;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rarity, var(--moon));
    box-shadow: 0 0 12px var(--rarity-glow);
    opacity: 0;
    animation: particle-fly 1.2s ease-out 0.35s forwards;
}
@keyframes particle-fly {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--px, 0px)), calc(-50% + var(--py, 0px))) scale(0.2); }
}
.drop-info {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    z-index: 3; opacity: 0;
    animation: info-appear 0.6s ease-out 0.7s forwards;
}
@keyframes info-appear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.drop-rarity-badge {
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 900;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--rarity, var(--moon-bright));
    text-shadow: 1px 1px 0 var(--ink), 0 0 15px var(--rarity-glow), 0 0 30px var(--rarity-glow);
    padding: 6px 18px;
    border: 2px solid var(--rarity, var(--moon));
    border-radius: 6px;
    background: rgba(10, 10, 26, 0.6);
    box-shadow: 0 0 20px var(--rarity-glow), inset 0 0 15px rgba(0, 0, 0, 0.5);
}
.drop-name {
    font-family: 'IM Fell English SC', serif; font-size: 32px;
    letter-spacing: 1px; color: var(--moon-bright);
    text-align: center;
    text-shadow: 3px 3px 0 var(--ink), 1px 1px 0 var(--ink), 0 0 20px var(--rarity-glow);
    line-height: 1.15; margin-top: 4px;
}
.drop-slot-type {
    font-family: 'Kalam', cursive; font-size: 14px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--moon-shadow); text-shadow: 1px 1px 0 var(--ink);
    opacity: 0.8;
}
.drop-effect {
    font-family: 'Kalam', cursive; font-size: 17px; line-height: 1.5;
    color: var(--moon); text-align: center;
    margin-top: 18px; padding: 14px 28px;
    border: 2px solid var(--ink); border-radius: 10px;
    background:
        radial-gradient(ellipse 60% 40% at 50% 50%, var(--rarity-glow), transparent 70%),
        linear-gradient(180deg, rgba(20, 20, 45, 0.85), rgba(10, 10, 26, 0.95));
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), inset 0 0 25px rgba(0, 0, 0, 0.7), 0 0 15px var(--rarity-glow);
    text-shadow: 1px 1px 0 var(--ink);
    max-width: 480px;
}
.drop-effect b {
    color: var(--rarity, var(--moon-bright)); font-weight: 700;
    text-shadow: 1px 1px 0 var(--ink), 0 0 10px var(--rarity-glow);
}
.drop-collect-btn {
    font-family: 'Cinzel', serif; font-size: 16px; font-weight: 900;
    letter-spacing: 5px; text-transform: uppercase;
    color: var(--gold-light);
    padding: 16px 48px; border-radius: 12px;
    border: 3px solid var(--ink); cursor: pointer;
    margin-top: 32px;
    background:
        radial-gradient(ellipse 60% 40% at 50% 50%, rgba(216, 168, 64, 0.15), transparent 70%),
        linear-gradient(135deg, rgba(42, 42, 74, 0.95), rgba(26, 26, 58, 0.95));
    box-shadow: 5px 5px 0 var(--ink), 0 15px 28px rgba(0, 0, 0, 0.6), 0 0 25px rgba(216, 168, 64, 0.5), inset 0 0 20px rgba(216, 168, 64, 0.1);
    text-shadow: 2px 2px 0 var(--ink), 0 0 15px rgba(216, 168, 64, 0.8);
    transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    opacity: 0;
    animation: info-appear 0.6s ease-out 1s forwards;
    z-index: 3;
}
.drop-collect-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 6px 6px 0 var(--ink), 0 20px 35px rgba(0, 0, 0, 0.7), 0 0 40px rgba(216, 168, 64, 0.8), inset 0 0 25px rgba(216, 168, 64, 0.2);
    color: #fff;
}

.toast {
    position: fixed; top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    z-index: 2000;
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold-light);
    padding: 10px 22px; border: 3px solid var(--ink); border-radius: 12px;
    background: linear-gradient(145deg, rgba(26,26,58,0.96), rgba(10,10,26,0.97));
    box-shadow: 5px 5px 0 var(--ink), 0 0 30px rgba(216,168,64,0.5);
    text-shadow: 2px 2px 0 var(--ink), 0 0 12px rgba(216,168,64,0.7);
    opacity: 0; pointer-events: none;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

        { id:'s5', slot:'shield', name:'Scudo del Drago',       icon:'🛡️', rarity:'epico',       effect:'+10 scudo iniziale',               stats:{ shieldStart:10 } },
        { id:'s6', slot:'shield', name:'Baluardo Eterno',       icon:'🛡️', rarity:'leggendario', effect:'+14 scudo iniziale, +3 HP massimi', stats:{ shieldStart:14, hpMax:3 } },

        { id:'p1', slot:'pet', name:'Pulcino',          icon:'🐣', rarity:'comune',      effect:'+3 HP massimi',                  stats:{ hpMax:3 } },
        { id:'p2', slot:'pet', name:'Coniglio',         icon:'🐇', rarity:'comune',      effect:'+2 HP, +1 rigenerazione',        stats:{ hpMax:2, regen:1 } },
        { id:'p3', slot:'pet', name:'Pappagallo',       icon:'🦜', rarity:'comune',      effect:'+4 HP massimi',                  stats:{ hpMax:4 } },
        { id:'p4', slot:'pet', name:'Scoiattolo',       icon:'🐿️', rarity:'comune',      effect:'+1 carta a inizio turno',        stats:{ extraDraw:1 } },
        { id:'p5', slot:'pet', name:'Gufo',             icon:'🦉', rarity:'raro',        effect:'+1 rigenerazione, +2 HP',        stats:{ regen:1, hpMax:2 } },
        { id:'p6', slot:'pet', name:'Riccio',           icon:'🦔', rarity:'raro',        effect:'+4 scudo iniziale, +1 rigenerazione', stats:{ shieldStart:4, regen:1 } },
        { id:'p7', slot:'pet', name:'Gatto Nero',       icon:'🐈‍⬛', rarity:'raro',        effect:'+6 HP, +1 scudo iniziale',       stats:{ hpMax:6, shieldStart:1 } },
        { id:'p8', slot:'pet', name:'Fantasma',         icon:'👻', rarity:'epico',       effect:'+1 carta in mano, +5 HP',        stats:{ extraDraw:1, hpMax:5 } },
        { id:'p9', slot:'pet', name:'Fenice Primordiale', icon:'🐦‍🔥', rarity:'leggendario', effect:'+1 carta, +2 rigenerazione, +1 mana', stats:{ extraDraw:1, regen:2, manaMax:1 } },
    ];

    const DROP_WEIGHTS = { comune: 70, raro: 22, epico: 7.8, leggendario: 0.2 };
    const MIN_BAG_SLOTS = 30;

    let inventory = [];
    let equipped = {};
    SLOTS.forEach(s => equipped[s.id] = null);
    let pendingDrop = null;
    let hideHighlightTimer = null;

    function pickRarity() {
        const total = Object.values(DROP_WEIGHTS).reduce((a, b) => a + b, 0);
        let r = Math.random() * total;
        for (const [rarity, weight] of Object.entries(DROP_WEIGHTS)) {
            r -= weight;
            if (r <= 0) return rarity;
        }
        return 'comune';
    }
    function rollDrop() {
        const rarity = pickRarity();
        const pool = ITEM_POOL.filter(i => i.rarity === rarity);
        if (pool.length === 0) return ITEM_POOL[0];
        return pool[Math.floor(Math.random() * pool.length)];
    }
    function slotName(id) {
        const s = SLOTS.find(x => x.id === id);
        return s ? s.name : id;
    }
    function slotEmptyIcon(id) {
        const s = SLOTS.find(x => x.id === id);
        return s ? s.emptyIcon : '?';
    }
    function getRarityColor(r) {
        return { comune:'var(--rarity-common)', raro:'var(--rarity-rare)',
                 epico:'var(--rarity-epic)', leggendario:'var(--rarity-legendary)' }[r] || 'var(--moon)';
    }
    function getRarityGlow(r) {
        return { comune:'rgba(138,155,181,0.7)', raro:'rgba(93,185,255,0.8)',
                 epico:'rgba(208,112,224,0.9)', leggendario:'rgba(240,168,64,1)' }[r] || 'rgba(168,213,240,0.7)';
    }
    function getContributions(item) {
        if (!item || !item.stats) return '';
        return Object.keys(item.stats).join(',');
    }

    function renderSlot(slotEl, slotId) {
        const item = equipped[slotId];
        const emptyIcon = slotEmptyIcon(slotId);
        const defaultLabel = slotName(slotId);

        if (item) {
            slotEl.classList.add('filled');
            slotEl.classList.remove('rarity-comune','rarity-raro','rarity-epico','rarity-leggendario');
            slotEl.classList.add('rarity-' + item.rarity);
            slotEl.style.setProperty('--rarity', getRarityColor(item.rarity));
            slotEl.style.setProperty('--rarity-glow', getRarityGlow(item.rarity));
            slotEl.dataset.contributions = getContributions(item);
            slotEl.innerHTML = `
                <div class="slot-icon">${item.icon}</div>
                <div class="slot-item-name">${item.name}</div>
            `;
            slotEl.title = `${item.name} — ${item.effect}`;
        } else {
            slotEl.classList.remove('filled','rarity-comune','rarity-raro','rarity-epico','rarity-leggendario','bonus-source');
            slotEl.style.removeProperty('--rarity');
            slotEl.style.removeProperty('--rarity-glow');
            slotEl.dataset.contributions = '';
            slotEl.innerHTML = `
                <div class="slot-icon">${emptyIcon}</div>
                <div class="slot-label">${defaultLabel}</div>
            `;
            slotEl.title = defaultLabel;
        }
    }

    function renderEquipped() {
        SLOTS.forEach(slot => {
            const el = document.querySelector(`.slot[data-slot="${slot.id}"]`);
            if (el) renderSlot(el, slot.id);
        });
        renderStatsSummary();
    }

    function renderBag() {
        const grid = document.getElementById('bag-grid');
        grid.innerHTML = '';
        let visibleSlots = MIN_BAG_SLOTS;
        let lastOccupied = -1;
        for (let i = inventory.length - 1; i >= 0; i--) {
            if (inventory[i]) { lastOccupied = i; break; }
        }
        if (lastOccupied >= MIN_BAG_SLOTS) {
            visibleSlots = Math.ceil((lastOccupied + 1) / 6) * 6;
        }
        for (let i = 0; i < visibleSlots; i++) {
            const item = inventory[i];
            const slot = document.createElement('div');
            slot.className = 'bag-slot' + (item ? ' filled rarity-' + item.rarity : '');
            if (item) {
                slot.textContent = item.icon;
                slot.style.setProperty('--rarity', getRarityColor(item.rarity));
                slot.style.setProperty('--rarity-glow', getRarityGlow(item.rarity));
                slot.title = `${item.name} (${slotName(item.slot)}) — ${item.effect}`;
                slot.addEventListener('click', () => equipFromBag(i));
            }
            grid.appendChild(slot);
        }
        const count = inventory.filter(x => x).length;
        const counterEl = document.getElementById('bag-counter');
        counterEl.innerHTML = `<span class="value">${count}</span> ${count === 1 ? 'oggetto' : 'oggetti'}`;
    }

    function equipFromBag(idx) {
        const item = inventory[idx];
        if (!item) return;
        const slotId = item.slot;
        const current = equipped[slotId];
        if (current) { inventory[idx] = current; } else { inventory.splice(idx, 1); }
        equipped[slotId] = item;
        renderEquipped();
        renderBag();
    }

    function unequipFromSlot(slotId) {
        const item = equipped[slotId];
        if (!item) return;
        let emptyIdx = -1;
        for (let i = 0; i < Math.max(inventory.length, MIN_BAG_SLOTS); i++) {
            if (!inventory[i]) { emptyIdx = i; break; }
        }
        if (emptyIdx === -1) emptyIdx = inventory.length;
        inventory[emptyIdx] = item;
        equipped[slotId] = null;
        renderEquipped();
        renderBag();
    }

    function renderStatsSummary() {
        const totals = computeEquippedStats();
        const el = document.getElementById('stats-summary');
        const rows = [];
        Object.entries(STAT_LABELS).forEach(([key, def]) => {
            const value = totals[key];
            if (value > 0) {
                rows.push(`
                    <div class="stat-row" data-stat="${key}">
                        <span class="stat-icon">${def.icon}</span>
                        <span class="stat-value">+${value}</span>
                        <span class="stat-label">${def.label(value)}</span>
                    </div>
                `);
            }
        });
        el.innerHTML = rows.length ? rows.join('') : '<div class="stat-empty">Nessun bonus attivo</div>';
        el.addEventListener('mouseenter', () => {
            clearTimeout(hideHighlightTimer);
            document.body.classList.add('stat-highlight');
        });
        el.addEventListener('mouseleave', () => {
            clearTimeout(hideHighlightTimer);
            hideHighlightTimer = setTimeout(() => {
                document.body.classList.remove('stat-highlight');
                document.querySelectorAll('.slot').forEach(slot => {
                    slot.classList.remove('bonus-source');
                });
            }, 250);
        });
        el.querySelectorAll('.stat-row').forEach(row => {
            row.addEventListener('mouseenter', () => {
                clearTimeout(hideHighlightTimer);
                document.body.classList.add('stat-highlight');
                highlightBonus(row.dataset.stat);
            });
        });
    }

    function highlightBonus(stat) {
        document.querySelectorAll('.slot').forEach(el => {
            const contribs = (el.dataset.contributions || '').split(',');
            if (contribs.includes(stat)) { el.classList.add('bonus-source'); }
            else { el.classList.remove('bonus-source'); }
        });
    }

    function computeEquippedStats() {
        const totals = { hpMax:0, dmgBonus:0, shieldStart:0, manaMax:0, regen:0, extraDraw:0 };
        SLOTS.forEach(slot => {
            const it = equipped[slot.id];
            if (!it || !it.stats) return;
            for (const [k, v] of Object.entries(it.stats)) {
                if (k in totals) totals[k] += v;
            }
        });
        return totals;
    }

    function showDropStage(item) {
        const stage = document.getElementById('drop-stage');
        const rarityColor = getRarityColor(item.rarity);
        const rarityGlow = getRarityGlow(item.rarity);
        let particlesHTML = '';
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const dist = 180 + Math.random() * 80;
            const px = Math.cos(angle) * dist;
            const py = Math.sin(angle) * dist;
            particlesHTML += `<div class="drop-particle" style="--px:${px}px; --py:${py}px;"></div>`;
        }
        stage.innerHTML = `
            <div class="drop-title">Bottino</div>
            <div class="drop-subtitle">Il nemico ha lasciato cadere qualcosa...</div>
            <div class="drop-emoji-wrap" style="--rarity:${rarityColor}; --rarity-glow:${rarityGlow};">
                <div class="drop-impact" style="border-color:${rarityColor};"></div>
                <div class="drop-particles" style="--rarity:${rarityColor}; --rarity-glow:${rarityGlow};">
                    ${particlesHTML}
                </div>
                <div class="drop-emoji">${item.icon}</div>
            </div>
            <div class="drop-info">
                <div class="drop-rarity-badge" style="--rarity:${rarityColor}; --rarity-glow:${rarityGlow};">
                    ${item.rarity}
                </div>
                <div class="drop-name">${item.name}</div>
                <div class="drop-slot-type">${slotName(item.slot)}</div>
                <div class="drop-effect" style="--rarity:${rarityColor}; --rarity-glow:${rarityGlow};">
                    <b>${item.effect}</b>
                </div>
            </div>
            <button class="drop-collect-btn" id="btn-collect">Raccogli</button>
        `;
        document.getElementById('drop-modal').classList.add('active');
        document.getElementById('btn-collect').addEventListener('click', collectDrop);
    }

    function simulateVictory() {
        pendingDrop = rollDrop();
        showDropStage(pendingDrop);
    }
    function testLegendary() {
        pendingDrop = ITEM_POOL.find(i => i.rarity === 'leggendario');
        showDropStage(pendingDrop);
    }
    function collectDrop() {
        if (!pendingDrop) return;
        let emptyIdx = -1;
        for (let i = 0; i < Math.max(inventory.length, MIN_BAG_SLOTS); i++) {
            if (!inventory[i]) { emptyIdx = i; break; }
        }
        if (emptyIdx === -1) emptyIdx = inventory.length;
        inventory[emptyIdx] = pendingDrop;
        const name = pendingDrop.name;
        document.getElementById('drop-modal').classList.remove('active');
        pendingDrop = null;
        renderBag();
        showToast(`${name} aggiunto allo zaino`);
    }

    let toastTimer = null;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('visible'), 2500);
    }
    function resetAll() {
        inventory = [];
        equipped = {};
        SLOTS.forEach(s => equipped[s.id] = null);
        renderEquipped();
        renderBag();
        showToast('Tutto resettato');
    }

    SLOTS.forEach(slot => {
        const el = document.querySelector(`.slot[data-slot="${slot.id}"]`);
        if (el) {
            renderSlot(el, slot.id);
            el.addEventListener('click', () => unequipFromSlot(slot.id));
        }
    });
    renderBag();
    renderStatsSummary();

    document.getElementById('btn-back').addEventListener('click', () => {
        window.location.href = 'index.html';
    });
    document.getElementById('btn-drop').addEventListener('click', simulateVictory);
    document.getElementById('btn-legendary').addEventListener('click', testLegendary);
    document.getElementById('btn-reset').addEventListener('click', resetAll);
})();
</script>
