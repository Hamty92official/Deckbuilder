<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Antiquario - Deckbuilder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Kalam:wght@400;700&family=Cinzel:wght@600;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* FASE5_4C_TRADE */
html, body {
    height: 100%; margin: 0; overflow: hidden;
    font-family: 'IM Fell English', 'Cinzel', Georgia, serif;
    color: var(--moon-bright);
    background: #0a0a1a;
}
.bg-loop {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
    pointer-events: none; user-select: none;
}
body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(10,10,26,0.3) 0%, rgba(10,10,26,0.6) 55%, rgba(10,10,26,0.85) 100%);
    z-index: 1; pointer-events: none;
}
.shop-page {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 20px; box-sizing: border-box;
}
.shop-panel {
    width: min(1200px, 92vw); max-height: 92vh;
    padding: 26px 30px; border-radius: 18px;
    border: 3px solid var(--ink);
    background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(216,168,64,.14), transparent 70%),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(216,64,128,.10), transparent 70%),
        linear-gradient(145deg, rgba(26,26,58,.94), rgba(10,10,26,.96));
    box-shadow:
        6px 6px 0 var(--ink),
        0 22px 44px rgba(0,0,0,.85),
        0 0 40px rgba(216,168,64,.28),
        inset 0 0 0 2px rgba(168,213,240,.14);
    overflow-y: auto; box-sizing: border-box;
}
.shop-header {
    display: flex; align-items: center; gap: 18px;
    padding-bottom: 16px;
    border-bottom: 2px solid rgba(168,213,240,.18);
    margin-bottom: 16px;
}
.shop-icon {
    font-size: 54px; line-height: 1;
    filter: drop-shadow(2px 2px 0 var(--ink)) drop-shadow(0 0 16px rgba(216,168,64,.65));
}
.shop-titles { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.shop-title {
    font-family: 'Cinzel', serif; font-size: 22px; font-weight: 900;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold-light);
    text-shadow: 2px 2px 0 var(--ink), 0 0 14px rgba(216,168,64,.75);
    line-height: 1.1;
}
.shop-tagline {
    font-family: 'IM Fell English', serif; font-style: italic;
    font-size: 13px; color: var(--moon-shadow);
    text-shadow: 1px 1px 0 var(--ink);
}
.shop-desc {
    font-family: 'Kalam', cursive; font-size: 14px; line-height: 1.55;
    color: var(--moon-bright); text-shadow: 1px 1px 0 var(--ink);
    margin-bottom: 22px; text-align: center;
}
.shop-desc b { color: var(--gold-light); font-weight: 700; }
.shop-cards {
    display: flex; gap: 24px;
    justify-content: center; flex-wrap: wrap;
    margin-bottom: 24px; min-height: 320px;
    align-items: center;
}
.shop-cards .card {
    position: relative; cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.25s ease, opacity 0.3s ease, filter 0.3s ease;
    width: clamp(140px, 12vw, 200px);
    height: clamp(210px, 18vw, 290px);
    transform: none;
}
.shop-cards .card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow:
        5px 5px 0 var(--ink),
        0 20px 40px rgba(0,0,0,.7),
        0 0 30px rgba(216,168,64,.5),
        inset 0 0 0 2px rgba(168,213,240,.2);
}
.shop-cards .card.taken {
    pointer-events: none; opacity: 0.3; filter: grayscale(0.8);
}
.shop-actions {
    display: flex; gap: 16px; justify-content: center;
    padding-top: 16px;
    border-top: 2px solid rgba(168,213,240,.14);
    flex-wrap: wrap;
}
.shop-btn {
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 12px 28px; border-radius: 10px;
    border: 3px solid var(--ink); cursor: pointer;
    color: var(--moon-bright);
    background:
        radial-gradient(ellipse 40% 25% at 78% 18%, rgba(0,0,0,.5), transparent 70%),
        linear-gradient(135deg, rgba(42,42,74,.95), rgba(15,15,40,.97));
    box-shadow:
        4px 4px 0 var(--ink),
        0 10px 20px rgba(0,0,0,.55),
        inset 0 0 0 2px rgba(168,213,240,.12);
    text-shadow: 2px 2px 0 var(--ink);
    transition: transform .2s, box-shadow .2s, color .2s;
    display: inline-flex; align-items: center; gap: 10px;
}
.shop-btn:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.04); color: #fff;
    box-shadow:
        5px 5px 0 var(--ink),
        0 14px 26px rgba(0,0,0,.65),
        0 0 22px rgba(216,168,64,.6);
}
.shop-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.shop-btn-exit { color: var(--moon-shadow); }
.shop-btn-reroll { color: var(--gold-light); }
.shop-btn-reroll .reroll-count {
    display: inline-block;
    background: linear-gradient(135deg, var(--magenta), #6a1040);
    color: #fff; font-family: 'Cinzel', serif;
    font-size: 12px; font-weight: 900;
    padding: 2px 8px; border-radius: 8px;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    min-width: 20px; text-align: center;
}

/* --- Modale selezione sacrifici --- */
#sacrifice-modal .modal-content {
    width: min(1100px, 94vw);
    max-width: 1100px;
}
#sacrifice-modal .deck-grid {
    max-height: 60vh;
    padding: 14px;
    gap: 14px;
}
#sacrifice-modal .deck-grid .card {
    width: clamp(100px, 10vw, 170px);
    height: clamp(150px, 15vw, 250px);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}
#sacrifice-modal .deck-grid .card:hover {
    transform: translateY(-8px) scale(1.04) !important;
}
#sacrifice-modal .deck-grid .card.sacrifice-card.selected {
    box-shadow:
        0 0 0 4px var(--gold-light),
        0 0 30px 6px rgba(240, 200, 112, 0.9),
        5px 5px 0 var(--ink) !important;
    transform: translateY(-6px) scale(1.04) !important;
}
#sacrifice-modal .deck-grid .card.sacrifice-card.selected::after {
    content: '✓';
    position: absolute;
    top: 6px; right: 6px;
    background: var(--gold-light);
    color: var(--ink);
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 20px; font-weight: 900;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    z-index: 20;
}
#sacrifice-modal .deck-grid .card.sacrifice-card.blocked {
    opacity: 0.5;
    cursor: not-allowed;
}
#sacrifice-modal .sacrifice-status {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--moon-bright);
    text-align: center;
    margin-top: 14px;
    text-shadow: 2px 2px 0 var(--ink);
}
#sacrifice-modal .sacrifice-status b {
    color: var(--gold-light);
    text-shadow: 2px 2px 0 var(--ink), 0 0 12px rgba(216,168,64,.7);
}

/* --- Toast --- */
.shop-toast {
    position: fixed;
    top: 40px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    z-index: 9999;
    padding: 14px 28px;
    border-radius: 12px;
    border: 3px solid var(--ink);
    background: linear-gradient(145deg, rgba(26,26,58,.98), rgba(10,10,26,.99));
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: 13px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 5px 5px 0 var(--ink), 0 0 30px rgba(216,168,64,.5);
    text-shadow: 2px 2px 0 var(--ink);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    max-width: 80vw;
    text-align: center;
}
.shop-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<video class="bg-loop" autoplay muted loop playsinline preload="auto">
    <source src="bg-antiquario.webm" type="video/webm">
</video>

<div class="shop-page">
    <div class="shop-panel">
        <div class="shop-header">
            <div class="shop-icon">🎴</div>
            <div class="shop-titles">
                <div class="shop-title">L'Antiquario</div>
                <div class="shop-tagline">Mercante collezionista</div>
            </div>
        </div>
        <div class="shop-desc">
            Il mercante ti offre <b>tre carte misteriose</b>. Scegline una e sacrifica alcune carte del tuo mazzo per ottenerla.
        </div>
        <div class="shop-cards" id="shop-cards"></div>
        <div class="shop-actions">
            <button class="shop-btn shop-btn-reroll" id="shop-reroll-btn" disabled>
                <span>🎲</span>
                <span>Reroll</span>
                <span class="reroll-count" id="shop-reroll-count">0</span>
            </button>
            <button class="shop-btn shop-btn-exit" id="shop-exit-btn">Torna al gioco</button>
        </div>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/shop-cards.js"></script>
<script>
(function(){
    'use strict';

    var STATE_KEY = 'db_shop_state';
    var MIN_DECK = 15;
    var state = null;

    // ---------- PERSISTENZA ----------
    function loadState() {
        try {
            var raw = localStorage.getItem(STATE_KEY);
            if (!raw) return null;
            var s = JSON.parse(raw);
            if (!s || !Array.isArray(s.offers) || s.offers.length !== 3) return null;
            return s;
        } catch(e) { return null; }
    }
    function saveState(s) {
        try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch(e) {}
    }
    function clearState() {
        try { localStorage.removeItem(STATE_KEY); } catch(e) {}
    }

    // ---------- REROLL (da equip) ----------
    function getRerollsAvailable() {
        try {
            var slot = localStorage.getItem('db_active_slot');
            if (!slot) return 0;
            var data = JSON.parse(localStorage.getItem('db_slot_' + slot) || '{}');
            if (!data || !data.equipped) return 0;
            var tot = 0;
            Object.values(data.equipped).forEach(function(item) {
                if (item && item.stats && item.stats.totReroll) tot += item.stats.totReroll;
            });
            return tot;
        } catch(e) { return 0; }
    }

    // ---------- OFFERTE ----------
    function pickThreeDistinct() {
        var picked = [], seen = {}, safety = 0;
        while (picked.length < 3 && safety < 50) {
            safety++;
            var card = rollShopCard();
            if (!card || seen[card.title]) continue;
            seen[card.title] = true;
            picked.push(card);
        }
        return picked;
    }

    // ---------- DECK DI LAVORO ----------
    function getWorkingDeck() {
        if (typeof getPersistentDeck === 'function') {
            var pers = getPersistentDeck();
            if (pers) return pers;
        }
        // Fallback: default
        var arr = [];
        if (typeof cardDatabase !== 'undefined' && typeof CARD_COPIES !== 'undefined') {
            cardDatabase.forEach(function(card) {
                var n = CARD_COPIES[card.title] || 1;
                for (var i = 0; i < n; i++) arr.push(Object.assign({}, card));
            });
        }
        return arr;
    }

    function saveWorkingDeck(newDeck) {
        if (typeof savePersistentDeck === 'function') {
            savePersistentDeck(newDeck);
        }
        // Aggiorna anche il save game
        try {
            var slot = localStorage.getItem('db_active_slot');
            if (!slot) return;
            var raw = localStorage.getItem('db_slot_' + slot);
            if (!raw) return;
            var save = JSON.parse(raw);
            save.deck = newDeck;
            save.savedAt = new Date().toISOString();
            localStorage.setItem('db_slot_' + slot, JSON.stringify(save));
        } catch(e) {}
    }

    // ---------- COSTO PER RARITA' ----------
    function rarityCost(cardData) {
        switch (cardData.rarity) {
            case 'noncomune':   return 1;
            case 'raro':        return 2;
            case 'epico':       return 3;
            case 'leggendario': return 4;
            default:            return 1;
        }
    }

    // ---------- BUILD CARD ----------
    function getCardHitsLocal(card) {
        switch (card.fx) {
            case 'slash2':  return 2;
            case 'slash3':  return 3;
            case 'arrow3':  return 3;
            case 'arcane':  return 5;
            default:        return 1;
        }
    }
    function buildCard(cardData) {
        var hits = getCardHitsLocal(cardData);
        var basePerHit = Math.floor(cardData.value / hits);
        var descHtml = String(cardData.desc).replace(
            '{DMG}',
            '<span class="dmg-value">' + basePerHit + '</span>'
        );
        var el = document.createElement('div');
        el.className = 'card';
        if (cardData.rarity) el.classList.add('rarity-' + cardData.rarity);
        el.innerHTML = ''
            + '<div class="corner tl"></div><div class="corner tr"></div>'
            + '<div class="corner bl"></div><div class="corner br"></div>'
            + '<div class="card-cost">' + cardData.cost + '</div>'
            + '<div class="card-header"><span class="card-title">' + cardData.title + '</span></div>'
            + '<div class="card-art">' + cardData.art + '</div>'
            + '<div class="card-description">' + descHtml + '</div>';
        return el;
    }

    // ---------- TOAST ----------
    function showToast(msg) {
        var t = document.getElementById('shop-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'shop-toast';
            t.className = 'shop-toast';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.classList.add('visible');
        clearTimeout(t._t);
        t._t = setTimeout(function(){ t.classList.remove('visible'); }, 3000);
    }

    // ---------- MODALE SELEZIONE ----------
    function openSacrificeModal(cardData, cardIndex) {
        var cost = rarityCost(cardData);
        var deck = getWorkingDeck();

        if (deck.length - cost < MIN_DECK) {
            showToast('Numero minimo di carte raggiunto (' + MIN_DECK + '). Acquisisci nuove carte per scambiare.');
            return;
        }

        // Costruisci overlay
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay active';
        overlay.id = 'sacrifice-modal';
        overlay.innerHTML = ''
            + '<div class="modal-content">'
            + '  <div class="modal-header">'
            + '    <span class="modal-title" id="sacrifice-title"></span>'
            + '    <button class="modal-close-btn" id="sacrifice-close">&times;</button>'
            + '  </div>'
            + '  <div class="deck-grid" id="sacrifice-grid"></div>'
            + '  <div class="sacrifice-status" id="sacrifice-status"></div>'
            + '  <div class="submodal-actions" style="margin-top:16px;">'
            + '    <button class="submodal-btn submodal-primary" id="sacrifice-confirm" disabled>Conferma Scambio</button>'
            + '    <button class="submodal-btn" id="sacrifice-cancel">Annulla</button>'
            + '  </div>'
            + '</div>';
        document.body.appendChild(overlay);

        var selected = [];
        var grid = overlay.querySelector('#sacrifice-grid');
        var confirmBtn = overlay.querySelector('#sacrifice-confirm');
        var titleEl = overlay.querySelector('#sacrifice-title');
        var statusEl = overlay.querySelector('#sacrifice-status');

        function updateHeader() {
            titleEl.innerHTML = 'Sacrifica <b style="color:var(--gold-light)">' + cost + '</b> carte per <b style="color:var(--gold-light)">' + cardData.title + '</b>';
            statusEl.innerHTML = 'Selezionate: <b>' + selected.length + ' / ' + cost + '</b>';
            confirmBtn.disabled = selected.length !== cost;
        }
        updateHeader();

        // Righe del deck
        deck.forEach(function(c, idx) {
            var el = buildCard(c);
            el.classList.add('sacrifice-card');
            el.dataset.idx = idx;
            el.addEventListener('click', function() {
                var pos = selected.indexOf(idx);
                if (pos !== -1) {
                    selected.splice(pos, 1);
                    el.classList.remove('selected');
                    grid.querySelectorAll('.card.sacrifice-card.blocked').forEach(function(x){
                        x.classList.remove('blocked');
                    });
                } else {
                    if (selected.length >= cost) return;
                    selected.push(idx);
                    el.classList.add('selected');
                    if (selected.length === cost) {
                        grid.querySelectorAll('.card.sacrifice-card').forEach(function(x){
                            if (!x.classList.contains('selected')) x.classList.add('blocked');
                        });
                    }
                }
                updateHeader();
            });
            grid.appendChild(el);
        });

        function closeModal() {
            overlay.remove();
        }

        overlay.querySelector('#sacrifice-close').addEventListener('click', closeModal);
        overlay.querySelector('#sacrifice-cancel').addEventListener('click', closeModal);
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeModal();
        });

        confirmBtn.addEventListener('click', function() {
            if (selected.length !== cost) return;

            // Rimuovi le carte (indici decrescenti per non sballare)
            var toRemove = selected.slice().sort(function(a,b){ return b-a; });
            toRemove.forEach(function(i){ deck.splice(i, 1); });

            // Aggiungi la nuova carta
            deck.push(Object.assign({}, cardData));

            // Salva
            saveWorkingDeck(deck);

            // Aggiorna stato shop
            state.traded = true;
            saveState(state);
            renderOffers();
            renderReroll();
            closeModal();

            showToast('Scambio completato · ' + cardData.title + ' aggiunta al mazzo');
            console.log('[Shop] trade ok · deck size:', deck.length);
        });
    }

    // ---------- RENDER ----------
    function renderOffers() {
        var container = document.getElementById('shop-cards');
        if (!container) return;
        container.innerHTML = '';
        state.offers.forEach(function(cardData, i) {
            var el = buildCard(cardData);
            el.dataset.shopIndex = i;
            if (state.traded) el.classList.add('taken');
            el.addEventListener('click', function() {
                if (state.traded) return;
                openSacrificeModal(cardData, i);
            });
            container.appendChild(el);
        });
    }

    function renderReroll() {
        var btn = document.getElementById('shop-reroll-btn');
        var countEl = document.getElementById('shop-reroll-count');
        if (!btn) return;
        btn.disabled = state.rerollsLeft <= 0 || state.traded;
        if (countEl) countEl.textContent = String(state.rerollsLeft);
    }

    function doReroll() {
        if (state.traded || state.rerollsLeft <= 0) return;
        state.rerollsLeft--;
        state.offers = pickThreeDistinct();
        saveState(state);
        renderOffers();
        renderReroll();
    }

    function doExit() {
        clearState();
        window.location.href = 'index.html?autostart=1';
    }

    function init() {
        state = loadState();
        if (!state) {
            state = {
                offers: pickThreeDistinct(),
                rerollsLeft: getRerollsAvailable(),
                traded: false,
                createdAt: Date.now()
            };
            saveState(state);
        }
        renderOffers();
        renderReroll();

        var rerollBtn = document.getElementById('shop-reroll-btn');
        if (rerollBtn) rerollBtn.addEventListener('click', doReroll);
        var exitBtn = document.getElementById('shop-exit-btn');
        if (exitBtn) exitBtn.addEventListener('click', doExit);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    window.ShopPage = {
        getState: function() { return state; },
        reroll: doReroll,
        exit: doExit,
        clearState: clearState
    };
})();
</script>
</body>
</html>
