<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Goblin — Anteprima</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: 'Montserrat', 'Segoe UI', sans-serif;
  }
  body {
    background: radial-gradient(circle at 50% 45%, #2c3e50 0%, #1a252f 55%, #0d131a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    position: relative;
    width: min(92vw, 620px);
    height: min(92vh, 640px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene::before {
    content: '';
    position: absolute;
    left: 45%;
    top: 50%;
    width: 70%;
    height: 62%;
    transform: translate(-50%, -55%);
    background: radial-gradient(ellipse, rgba(120, 180, 100, 0.18) 0%, rgba(120, 180, 100, 0) 70%);
    pointer-events: none;
    animation: glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; transform: translate(-50%, -55%) scale(1); }
    50%      { opacity: 0.95; transform: translate(-50%, -55%) scale(1.06); }
  }

  .shadow {
    position: absolute;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    width: 65%;
    height: 9%;
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 72%);
    animation: shadowPulse 3.6s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1);    opacity: 0.9; }
    50%      { transform: translateX(-50%) scale(0.96); opacity: 0.7; }
  }

  .goblin {
    position: relative;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.55));
  }

  /* --- Animazioni --- */
  .goblin-root {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(0.997, 1.022); }
  }

  .head {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: headSway 5s ease-in-out infinite;
  }
  @keyframes headSway {
    0%, 100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1deg); }
  }

  .ear-left {
    transform-box: fill-box;
    transform-origin: right center;
    animation: earTwitchL 4.2s ease-in-out infinite;
  }
  @keyframes earTwitchL {
    0%, 82%, 100% { transform: rotate(0deg); }
    85%           { transform: rotate(-8deg); }
    90%           { transform: rotate(4deg); }
    93%           { transform: rotate(0deg); }
  }

  .ear-right {
    transform-box: fill-box;
    transform-origin: left center;
    animation: earTwitchR 4.7s ease-in-out infinite;
  }
  @keyframes earTwitchR {
    0%, 78%, 100% { transform: rotate(0deg); }
    81%           { transform: rotate(8deg); }
    86%           { transform: rotate(-4deg); }
    89%           { transform: rotate(0deg); }
  }

  .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 5.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(0.05); }
    97%           { transform: scaleY(1); }
  }

  .iris-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: irisPulse 2.4s ease-in-out infinite;
  }
  @keyframes irisPulse {
    0%, 100% { opacity: 0.75; }
    50%      { opacity: 1; }
  }

  .wisp-1 { animation: wispRise 3.2s ease-out infinite; }
  .wisp-2 { animation: wispRise 3.2s ease-out 1.6s infinite; }
  @keyframes wispRise {
    0%   { transform: translateY(0) scale(0.4);  opacity: 0; }
    20%  { opacity: 0.7; }
    65%  { opacity: 0.3; }
    100% { transform: translateY(-42px) scale(1.2); opacity: 0; }
  }

  .title {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.72);
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="shadow"></div>
    <div class="goblin">
      <svg viewBox="0 0 500 560" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
        <defs>
          <!-- Pelle -->
          <radialGradient id="skinBody" cx="40%" cy="30%" r="75%">
            <stop offset="0%"   stop-color="#a9d68a"/>
            <stop offset="45%"  stop-color="#6da858"/>
            <stop offset="80%"  stop-color="#3d6629"/>
            <stop offset="100%" stop-color="#21380f"/>
          </radialGradient>
          <radialGradient id="skinHead" cx="42%" cy="32%" r="75%">
            <stop offset="0%"   stop-color="#b8e09a"/>
            <stop offset="45%"  stop-color="#7cb662"/>
            <stop offset="82%"  stop-color="#3d6629"/>
            <stop offset="100%" stop-color="#21380f"/>
          </radialGradient>

          <!-- Pancia -->
          <radialGradient id="belly" cx="50%" cy="35%" r="72%">
            <stop offset="0%"   stop-color="#d4ecb8"/>
            <stop offset="100%" stop-color="#9cc77e"/>
          </radialGradient>

          <!-- Iride viola -->
          <radialGradient id="iris" cx="45%" cy="35%" r="65%">
            <stop offset="0%"   stop-color="#f0c8ff"/>
            <stop offset="25%"  stop-color="#c274ff"/>
            <stop offset="60%"  stop-color="#7b1fa2"/>
            <stop offset="100%" stop-color="#2e0745"/>
          </radialGradient>

          <!-- Legno -->
          <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#8b6046"/>
            <stop offset="55%"  stop-color="#5d3a25"/>
            <stop offset="100%" stop-color="#241209"/>
          </linearGradient>

          <!-- Testa mazza (pietra) -->
          <radialGradient id="clubHead" cx="35%" cy="28%" r="78%">
            <stop offset="0%"   stop-color="#a89080"/>
            <stop offset="55%"  stop-color="#4e342e"/>
            <stop offset="100%" stop-color="#0f0503"/>
          </radialGradient>

          <!-- Bagliore viola (solo per iride e sbuffi) -->
          <filter id="purpleGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <!-- Ombra morbida sotto i pezzi -->
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
          </filter>
        </defs>

        <!-- Ombra a terra dentro SVG -->
        <ellipse cx="230" cy="528" rx="130" ry="14" fill="#000" opacity="0.4"/>

        <g class="goblin-root">

          <!-- ================= GAMBE ================= -->
          <!-- Gamba sinistra (dietro) -->
          <path d="M 195 400 Q 190 450 195 490"
                stroke="#3d6629" stroke-width="38" stroke-linecap="round" fill="none"/>
          <!-- Gamba destra (dietro) -->
          <path d="M 265 400 Q 270 450 265 490"
                stroke="#3d6629" stroke-width="38" stroke-linecap="round" fill="none"/>

          <!-- ================= PIEDI ================= -->
          <!-- Piede sinistro -->
          <g filter="url(#softShadow)">
            <ellipse cx="195" cy="510" rx="52" ry="18" fill="#5a8a44"/>
            <!-- Dita -->
            <circle cx="152" cy="512" r="8" fill="#6b9e54"/>
            <circle cx="168" cy="518" r="7" fill="#6b9e54"/>
            <circle cx="184" cy="521" r="6" fill="#6b9e54"/>
            <!-- Unghie -->
            <ellipse cx="148" cy="509" rx="5" ry="3" fill="#e0d5b0"/>
            <ellipse cx="166" cy="515" rx="4" ry="2.5" fill="#e0d5b0"/>
          </g>
          <!-- Piede destro -->
          <g filter="url(#softShadow)">
            <ellipse cx="265" cy="510" rx="52" ry="18" fill="#5a8a44"/>
            <circle cx="308" cy="512" r="8" fill="#6b9e54"/>
            <circle cx="292" cy="518" r="7" fill="#6b9e54"/>
            <circle cx="276" cy="521" r="6" fill="#6b9e54"/>
            <ellipse cx="312" cy="509" rx="5" ry="3" fill="#e0d5b0"/>
            <ellipse cx="294" cy="515" rx="4" ry="2.5" fill="#e0d5b0"/>
          </g>

          <!-- ================= PERIZOMA (dietro) ================= -->
          <path d="M 155 415 Q 230 435 305 415 Q 315 445 305 465 Q 230 480 155 465 Z"
                fill="#5d4037"/>

          <!-- ================= BRACCIA (dietro al torso) ================= -->
          <!-- Braccio sinistro (nostra sinistra) -->
          <path d="M 165 300 Q 130 360 108 425"
                stroke="#3d6629" stroke-width="42" stroke-linecap="round" fill="none"/>
          <!-- Braccio destro (nostra destra, regge mazza) -->
          <path d="M 295 300 Q 330 350 350 400"
                stroke="#3d6629" stroke-width="42" stroke-linecap="round" fill="none"/>

          <!-- ================= TORSO ================= -->
          <path d="M 165 280 Q 145 330 148 400 Q 155 445 180 455
                   Q 230 465 280 455 Q 305 445 312 400
                   Q 315 330 295 280 Q 230 260 165 280 Z"
                fill="url(#skinBody)" filter="url(#softShadow)"/>

          <!-- Pancia chiara -->
          <ellipse cx="230" cy="380" rx="52" ry="58" fill="url(#belly)" opacity="0.9"/>

          <!-- Pettorali -->
          <path d="M 195 320 Q 205 305 220 315 Q 230 328 220 340 Q 205 345 195 320 Z"
                fill="#4e7d38" opacity="0.45"/>
          <path d="M 265 320 Q 255 305 240 315 Q 230 328 240 340 Q 255 345 265 320 Z"
                fill="#4e7d38" opacity="0.45"/>

          <!-- Ombelico -->
          <ellipse cx="230" cy="410" rx="5" ry="6" fill="#3a5c2a" opacity="0.7"/>

          <!-- Peli sul petto -->
          <path d="M 220 335 Q 226 330 232 335" stroke="#1f3312" stroke-width="1.2" fill="none" opacity="0.55"/>
          <path d="M 232 337 Q 238 332 244 337" stroke="#1f3312" stroke-width="1.2" fill="none" opacity="0.55"/>

          <!-- Cintura frontale -->
          <path d="M 152 448 Q 230 468 308 448 Q 318 470 306 490 Q 230 505 154 490 Z"
                fill="#5d4037"/>
          <rect x="222" y="448" width="16" height="55" fill="#3e2723" rx="3"/>
          <circle cx="230" cy="472" r="5" fill="#a1887f"/>
          <circle cx="230" cy="472" r="2" fill="#3e2723"/>

          <!-- ================= PUGNO SINISTRO ================= -->
          <g filter="url(#softShadow)">
            <ellipse cx="104" cy="440" rx="24" ry="26" fill="#5a8a44"/>
            <!-- Dita della mano (4 archi) -->
            <path d="M 86 428 Q 104 424 122 430" stroke="#2a4419" stroke-width="1.6" fill="none" opacity="0.85"/>
            <path d="M 86 438 Q 104 434 122 440" stroke="#2a4419" stroke-width="1.6" fill="none" opacity="0.85"/>
            <path d="M 86 448 Q 104 444 122 450" stroke="#2a4419" stroke-width="1.6" fill="none" opacity="0.85"/>
            <path d="M 88 456 Q 104 453 120 459" stroke="#2a4419" stroke-width="1.6" fill="none" opacity="0.85"/>
            <!-- Nocche -->
            <circle cx="96" cy="428" r="2" fill="#3d6629"/>
            <circle cx="104" cy="426" r="2" fill="#3d6629"/>
            <circle cx="113" cy="428" r="2" fill="#3d6629"/>
            <!-- Pollice piegato -->
            <path d="M 92 458 Q 88 445 96 434 Q 100 436 100 444 Q 100 452 108 456 Z"
                  fill="#6b9e54"/>
          </g>

          <!-- ================= TESTA ================= -->
          <g class="head">

            <!-- Orecchio dietro (destra) -->
            <g class="ear-right">
              <path d="M 285 118 Q 380 78 400 122 Q 372 155 300 165 Z"
                    fill="url(#skinHead)" filter="url(#softShadow)"/>
              <path d="M 296 124 Q 358 100 380 126 Q 358 145 312 152 Z"
                    fill="#b8708a" opacity="0.65"/>
              <!-- Vena corruzione orecchio -->
              <path d="M 320 120 Q 335 115 350 122" stroke="#6a3fa0" stroke-width="1" fill="none" opacity="0.55"/>
            </g>

            <!-- Forma testa -->
            <ellipse cx="230" cy="145" rx="95" ry="105" fill="url(#skinHead)" filter="url(#softShadow)"/>

            <!-- Rughe fronte -->
            <path d="M 165 70 Q 230 60 295 70" fill="none" stroke="#3a5c2a" stroke-width="2.6" opacity="0.5" stroke-linecap="round"/>
            <path d="M 175 84 Q 230 74 285 84" fill="none" stroke="#3a5c2a" stroke-width="2.2" opacity="0.38" stroke-linecap="round"/>

            <!-- Guance -->
            <ellipse cx="155" cy="190" rx="20" ry="26" fill="#3a5c2a" opacity="0.28"/>
            <ellipse cx="305" cy="190" rx="20" ry="26" fill="#3a5c2a" opacity="0.28"/>

            <!-- Orecchio davanti (sinistra) -->
            <g class="ear-left">
              <path d="M 155 118 Q 60 78 40 122 Q 68 155 140 165 Z"
                    fill="url(#skinHead)" filter="url(#softShadow)"/>
              <path d="M 144 124 Q 82 100 60 126 Q 82 145 128 152 Z"
                    fill="#b8708a" opacity="0.65"/>
              <path d="M 100 116 Q 85 111 70 118" stroke="#6a3fa0" stroke-width="1" fill="none" opacity="0.55"/>
            </g>

            <!-- ============ OCCHI ============ -->
            <!-- Occhio sinistro -->
            <g class="eye">
              <ellipse cx="190" cy="145" rx="26" ry="24" fill="#f5ecd8"/>
              <!-- Iride (senza alone nero esterno) -->
              <ellipse cx="192" cy="147" rx="15" ry="18" fill="url(#iris)"/>
              <!-- Bagliore interno sottile -->
              <ellipse cx="192" cy="147" rx="12" ry="15" fill="#c87aff" opacity="0.35"
                       class="iris-glow" filter="url(#purpleGlow)"/>
              <!-- Pupilla verticale -->
              <ellipse cx="192" cy="147" rx="4" ry="14" fill="#0c0410"/>
              <!-- Highlight -->
              <circle cx="186" cy="136" r="3.8" fill="#fff" opacity="0.95"/>
              <circle cx="196" cy="158" r="1.8" fill="#fff" opacity="0.5"/>
            </g>
            <!-- Occhio destro (leggermente più grande, corrotto) -->
            <g class="eye">
              <ellipse cx="272" cy="145" rx="27" ry="25" fill="#f5ecd8"/>
              <ellipse cx="272" cy="147" rx="16" ry="19" fill="url(#iris)"/>
              <ellipse cx="272" cy="147" rx="13" ry="16" fill="#c87aff" opacity="0.35"
                       class="iris-glow" filter="url(#purpleGlow)"/>
              <ellipse cx="272" cy="147" rx="4.2" ry="15" fill="#0c0410"/>
              <circle cx="266" cy="135" r="4" fill="#fff" opacity="0.95"/>
              <circle cx="277" cy="159" r="2" fill="#fff" opacity="0.5"/>
            </g>

            <!-- Sopracciglia aggressive (sopra gli occhi) -->
            <path d="M 160 108 Q 195 96 225 118" stroke="#1f3312" stroke-width="8" stroke-linecap="round" fill="none"/>
            <path d="M 300 108 Q 265 96 235 118" stroke="#1f3312" stroke-width="8" stroke-linecap="round" fill="none"/>

            <!-- Sbuffi viola che salgono dagli occhi -->
            <ellipse class="wisp-1" cx="188" cy="112" rx="10" ry="6" fill="#c266ff" opacity="0"
                     filter="url(#purpleGlow)"/>
            <ellipse class="wisp-2" cx="276" cy="110" rx="11" ry="6" fill="#c266ff" opacity="0"
                     filter="url(#purpleGlow)"/>

            <!-- Naso -->
            <path d="M 230 165 Q 250 188 240 216 Q 230 226 220 216 Q 210 188 230 165 Z"
                  fill="#5a8a44"/>
            <ellipse cx="230" cy="213" rx="13" ry="6" fill="#3a5c2a"/>
            <ellipse cx="224" cy="216" rx="3.2" ry="2.8" fill="#140804"/>
            <ellipse cx="236" cy="216" rx="3.2" ry="2.8" fill="#140804"/>
            <!-- Anello naso -->
            <circle cx="230" cy="222" r="5" fill="none" stroke="#d4c28a" stroke-width="2"/>
            <circle cx="230" cy="222" r="5" fill="none" stroke="#8c7640" stroke-width="0.8"/>

            <!-- Bocca con zanne -->
            <path d="M 185 240 Q 230 268 275 240 Q 230 252 185 240 Z" fill="#2a0f18"/>
            <!-- Zanne superiori -->
            <path d="M 193 240 L 188 262 L 208 248 Z" fill="#f5f5dc"/>
            <path d="M 267 240 L 272 262 L 252 248 Z" fill="#f5f5dc"/>
            <!-- Zanne inferiori -->
            <path d="M 212 248 L 215 236 L 222 248 Z" fill="#f5f5dc" opacity="0.95"/>
            <path d="M 248 248 L 245 236 L 238 248 Z" fill="#f5f5dc" opacity="0.95"/>

            <!-- Verruche -->
            <circle cx="160" cy="178" r="5" fill="#6b9e54"/>
            <circle cx="158" cy="176" r="2" fill="#3a5c2a" opacity="0.6"/>
            <circle cx="302" cy="192" r="6" fill="#6b9e54"/>
            <circle cx="300" cy="190" r="2.5" fill="#3a5c2a" opacity="0.6"/>
            <circle cx="258" cy="100" r="4" fill="#6b9e54"/>
            <circle cx="198" cy="102" r="3.5" fill="#6b9e54"/>

            <!-- Cicatrice -->
            <path d="M 278 118 L 298 148" stroke="#1f3312" stroke-width="2.4" fill="none" opacity="0.9" stroke-linecap="round"/>
            <path d="M 282 128 L 292 126" stroke="#1f3312" stroke-width="1.8" fill="none" opacity="0.9" stroke-linecap="round"/>
            <path d="M 285 138 L 296 136" stroke="#1f3312" stroke-width="1.8" fill="none" opacity="0.9" stroke-linecap="round"/>

            <!-- Vene corruzione sulla fronte -->
            <path d="M 175 80 Q 190 70 205 80" fill="none" stroke="#6a3fa0" stroke-width="1.3" opacity="0.6" stroke-linecap="round"/>
            <path d="M 255 78 Q 270 70 285 78" fill="none" stroke="#6a3fa0" stroke-width="1.3" opacity="0.6" stroke-linecap="round"/>
            <path d="M 152 210 Q 165 222 155 236" fill="none" stroke="#6a3fa0" stroke-width="1.1" opacity="0.5" stroke-linecap="round"/>
          </g>

          <!-- ================= MAZZA (a destra, inclinata verso l'esterno) ================= -->
          <g transform="rotate(22 350 400)">
            <!-- Manico in legno -->
            <rect x="338" y="240" width="24" height="200" rx="6"
                  fill="url(#wood)" filter="url(#softShadow)"/>
            <!-- Venature legno -->
            <path d="M 344 250 L 344 430" stroke="#0f0603" stroke-width="1" opacity="0.4"/>
            <path d="M 356 250 L 356 430" stroke="#0f0603" stroke-width="1" opacity="0.4"/>
            <!-- Legature cuoio -->
            <rect x="335" y="395" width="30" height="14" rx="3" fill="#2e1a12"/>
            <rect x="335" y="260" width="30" height="14" rx="3" fill="#2e1a12"/>
            <rect x="335" y="399" width="30" height="6" rx="2" fill="#6d5a3a"/>
            <rect x="335" y="264" width="30" height="6" rx="2" fill="#6d5a3a"/>

            <!-- Testa mazza -->
            <ellipse cx="350" cy="215" rx="56" ry="52" fill="url(#clubHead)" filter="url(#softShadow)"/>
            <ellipse cx="332" cy="190" rx="24" ry="16" fill="#b8a898" opacity="0.5"/>
            <!-- Crepe -->
            <path d="M 330 188 L 344 214 L 336 240" stroke="#0f0503" stroke-width="1.8" fill="none" opacity="0.85"/>
            <path d="M 366 195 L 378 220" stroke="#0f0503" stroke-width="1.4" fill="none" opacity="0.75"/>

            <!-- Spine (8) -->
            <g fill="#0f0503" stroke="#3e2a20" stroke-width="1">
              <path d="M 350 160 L 356 138 L 344 138 Z"/>
              <path d="M 350 270 L 356 292 L 344 292 Z"/>
              <path d="M 294 215 L 272 208 L 272 222 Z"/>
              <path d="M 406 215 L 428 208 L 428 222 Z"/>
              <path d="M 314 180 L 294 162 L 298 174 Z"/>
              <path d="M 386 180 L 406 162 L 402 174 Z"/>
              <path d="M 314 250 L 294 268 L 298 256 Z"/>
              <path d="M 386 250 L 406 268 L 402 256 Z"/>
            </g>
          </g>

          <!-- ================= MANO DESTRA CHE STRINGE LA MAZZA ================= -->
          <g filter="url(#softShadow)">
            <!-- Palmo (dietro il manico) -->
            <ellipse cx="350" cy="405" rx="22" ry="24" fill="#5a8a44"/>

            <!-- 4 dita che avvolgono il manico -->
            <path d="M 334 392 Q 350 388 366 394 L 366 400 Q 350 396 334 400 Z" fill="#6b9e54"/>
            <path d="M 334 402 Q 350 398 366 404 L 366 410 Q 350 406 334 410 Z" fill="#6b9e54"/>
            <path d="M 334 412 Q 350 408 366 414 L 366 420 Q 350 416 334 420 Z" fill="#6b9e54"/>
            <path d="M 336 422 Q 350 418 364 424 L 364 430 Q 350 426 336 430 Z" fill="#6b9e54"/>
            <!-- Separazioni tra le dita -->
            <path d="M 336 399 Q 350 397 364 401" stroke="#2a4419" stroke-width="1.2" fill="none" opacity="0.75"/>
            <path d="M 336 409 Q 350 407 364 411" stroke="#2a4419" stroke-width="1.2" fill="none" opacity="0.75"/>
            <path d="M 336 419 Q 350 417 364 421" stroke="#2a4419" stroke-width="1.2" fill="none" opacity="0.75"/>
            <!-- Unghie sulle dita -->
            <ellipse cx="366" cy="397" rx="3" ry="4" fill="#d4c28a"/>
            <ellipse cx="366" cy="407" rx="3" ry="4" fill="#d4c28a"/>
            <ellipse cx="366" cy="417" rx="3" ry="4" fill="#d4c28a"/>
            <ellipse cx="364" cy="427" rx="2.5" ry="3.5" fill="#d4c28a"/>

            <!-- Pollice sopra il manico -->
            <path d="M 340 384 Q 330 400 340 418 Q 348 420 352 414 Q 344 400 350 386 Z"
                  fill="#7cb662"/>
            <path d="M 344 392 L 344 408" stroke="#2a4419" stroke-width="1" fill="none" opacity="0.6"/>
            <ellipse cx="342" cy="386" rx="4" ry="5" fill="#d4c28a" transform="rotate(-30 342 386)"/>
          </g>

        </g>
      </svg>
    </div>
    <div class="title">Goblin Corrotto</div>
  </div>
</body>
</html>
