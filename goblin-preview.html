<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Goblin — Anteprima</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: 'Montserrat', 'Segoe UI', sans-serif;
  }
  body {
    background: radial-gradient(circle at 50% 45%, #2c3e50 0%, #1a252f 55%, #0d131a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    position: relative;
    width: min(90vw, 520px);
    height: min(90vh, 620px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Alone verde dietro il goblin */
  .scene::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70%;
    height: 60%;
    transform: translate(-50%, -55%);
    background: radial-gradient(ellipse, rgba(120, 180, 100, 0.18) 0%, rgba(120, 180, 100, 0) 70%);
    pointer-events: none;
    animation: glowPulse 4s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -55%) scale(1); }
    50%      { opacity: 1;   transform: translate(-50%, -55%) scale(1.05); }
  }

  /* Ombra a terra */
  .shadow {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 55%;
    height: 8%;
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 70%);
    animation: shadowPulse 3.6s ease-in-out infinite;
  }

  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1);    opacity: 0.85; }
    50%      { transform: translateX(-50%) scale(0.94); opacity: 0.65; }
  }

  .goblin {
    position: relative;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.5));
  }

  /* --- Animazioni SVG (supportate da Chrome/Safari/Firefox moderni) --- */
  .goblin-root {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(0.995, 1.022); }
  }

  .head {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: headSway 5s ease-in-out infinite;
  }
  @keyframes headSway {
    0%, 100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1deg); }
  }

  .ear-left {
    transform-box: fill-box;
    transform-origin: right center;
    animation: earTwitchL 4.2s ease-in-out infinite;
  }
  @keyframes earTwitchL {
    0%, 85%, 100% { transform: rotate(0deg); }
    88%           { transform: rotate(-7deg); }
    92%           { transform: rotate(3deg); }
    95%           { transform: rotate(0deg); }
  }

  .ear-right {
    transform-box: fill-box;
    transform-origin: left center;
    animation: earTwitchR 4.7s ease-in-out infinite;
  }
  @keyframes earTwitchR {
    0%, 80%, 100% { transform: rotate(0deg); }
    83%           { transform: rotate(7deg); }
    87%           { transform: rotate(-3deg); }
    90%           { transform: rotate(0deg); }
  }

  .eye-left, .eye-right {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 5.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 93%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.08); }
    97%           { transform: scaleY(1); }
  }

  .title {
    position: absolute;
    bottom: 1%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="shadow"></div>
    <div class="goblin">
      <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
        <defs>
          <radialGradient id="skinGrad" cx="45%" cy="35%" r="70%">
            <stop offset="0%"   stop-color="#9fd482"/>
            <stop offset="55%"  stop-color="#6ba557"/>
            <stop offset="100%" stop-color="#3f6b32"/>
          </radialGradient>
          <radialGradient id="bellyGrad" cx="50%" cy="40%" r="70%">
            <stop offset="0%"   stop-color="#c4e6a8"/>
            <stop offset="100%" stop-color="#8fc97a"/>
          </radialGradient>
          <radialGradient id="eyeGrad" cx="50%" cy="35%" r="60%">
            <stop offset="0%"   stop-color="#fff9c4"/>
            <stop offset="55%"  stop-color="#ffb300"/>
            <stop offset="100%" stop-color="#c62828"/>
          </radialGradient>
          <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#8d6e63"/>
            <stop offset="100%" stop-color="#4e342e"/>
          </linearGradient>
          <radialGradient id="clubTopGrad" cx="40%" cy="35%" r="70%">
            <stop offset="0%"   stop-color="#a1887f"/>
            <stop offset="100%" stop-color="#3e2723"/>
          </radialGradient>
        </defs>

        <g class="goblin-root">
          <!-- Ombra sotto i piedi (interna all'SVG) -->
          <ellipse cx="200" cy="478" rx="100" ry="10" fill="#000" opacity="0.25"/>

          <!-- Gamba sinistra -->
          <ellipse cx="160" cy="455" rx="32" ry="18" fill="#3f6b32"/>
          <!-- Gamba destra -->
          <ellipse cx="240" cy="455" rx="32" ry="18" fill="#3f6b32"/>
          <!-- Piede sinistro -->
          <ellipse cx="155" cy="468" rx="40" ry="14" fill="#5a9048"/>
          <!-- Piede destro -->
          <ellipse cx="245" cy="468" rx="40" ry="14" fill="#5a9048"/>

          <!-- Braccio sinistro -->
          <path d="M 140 310 Q 100 340 88 395 Q 82 425 105 430 Q 118 425 118 400 Q 120 365 148 335 Z"
                fill="url(#skinGrad)"/>
          <!-- Mano sinistra (pugno) -->
          <ellipse cx="105" cy="425" rx="20" ry="18" fill="#5a9048"/>

          <!-- Corpo / Torso -->
          <path d="M 135 285 Q 115 370 125 435 Q 200 460 275 435 Q 285 370 265 285 Z"
                fill="url(#skinGrad)"/>
          <!-- Pancia chiara -->
          <ellipse cx="200" cy="385" rx="45" ry="55" fill="url(#bellyGrad)" opacity="0.85"/>

          <!-- Cintura/panno -->
          <path d="M 125 415 Q 200 435 275 415 Q 280 435 275 450 Q 200 470 125 450 Z"
                fill="#5d4037"/>
          <rect x="192" y="415" width="16" height="45" fill="#3e2723" rx="3"/>

          <!-- Braccio destro (con mazza) -->
          <path d="M 260 310 Q 300 330 318 375 Q 328 405 310 415 Q 298 410 295 390 Q 288 355 262 335 Z"
                fill="url(#skinGrad)"/>
          <!-- Mano destra -->
          <ellipse cx="308" cy="410" rx="22" ry="20" fill="#5a9048"/>

          <!-- Mazza -->
          <g>
            <rect x="300" y="180" width="18" height="220" rx="6"
                  fill="url(#woodGrad)" transform="rotate(18 309 290)"/>
            <ellipse cx="328" cy="180" rx="38" ry="32"
                     fill="url(#clubTopGrad)" transform="rotate(18 328 180)"/>
            <circle cx="312" cy="162" r="4" fill="#1a1a1a"/>
            <circle cx="338" cy="175" r="4" fill="#1a1a1a"/>
            <circle cx="340" cy="200" r="4" fill="#1a1a1a"/>
            <circle cx="320" cy="200" r="4" fill="#1a1a1a"/>
            <rect x="298" y="240" width="22" height="14" rx="3"
                  fill="#3e2723" transform="rotate(18 309 247)"/>
          </g>

          <!-- Testa -->
          <g class="head">
            <!-- Orecchie -->
            <g class="ear-left">
              <path d="M 118 165 Q 38 95 28 135 Q 55 158 112 195 Z" fill="url(#skinGrad)"/>
              <path d="M 110 172 Q 65 132 60 145 Q 78 158 106 182 Z" fill="#c98888" opacity="0.65"/>
            </g>
            <g class="ear-right">
              <path d="M 282 165 Q 362 95 372 135 Q 345 158 288 195 Z" fill="url(#skinGrad)"/>
              <path d="M 290 172 Q 335 132 340 145 Q 322 158 294 182 Z" fill="#c98888" opacity="0.65"/>
            </g>

            <!-- Forma testa -->
            <ellipse cx="200" cy="180" rx="92" ry="105" fill="url(#skinGrad)"/>

            <!-- Rughe fronte -->
            <path d="M 155 105 Q 200 95 245 105" fill="none" stroke="#3f6b32" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
            <path d="M 162 118 Q 200 110 238 118" fill="none" stroke="#3f6b32" stroke-width="2" opacity="0.45" stroke-linecap="round"/>

            <!-- Guance scure -->
            <ellipse cx="130" cy="230" rx="18" ry="25" fill="#3f6b32" opacity="0.25"/>
            <ellipse cx="270" cy="230" rx="18" ry="25" fill="#3f6b32" opacity="0.25"/>

            <!-- Occhio sinistro -->
            <g class="eye-left">
              <ellipse cx="165" cy="175" rx="24" ry="20" fill="#1a1a1a" opacity="0.35"/>
              <ellipse cx="165" cy="175" rx="22" ry="18" fill="url(#eyeGrad)"/>
              <ellipse cx="165" cy="178" rx="9" ry="14" fill="#0a0a0a"/>
              <circle cx="162" cy="171" r="3.5" fill="white" opacity="0.95"/>
            </g>
            <!-- Occhio destro -->
            <g class="eye-right">
              <ellipse cx="235" cy="175" rx="24" ry="20" fill="#1a1a1a" opacity="0.35"/>
              <ellipse cx="235" cy="175" rx="22" ry="18" fill="url(#eyeGrad)"/>
              <ellipse cx="235" cy="178" rx="9" ry="14" fill="#0a0a0a"/>
              <circle cx="232" cy="171" r="3.5" fill="white" opacity="0.95"/>
            </g>

            <!-- Sopracciglia aggressive -->
            <path d="M 138 152 Q 165 145 195 162" stroke="#2a4a20" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M 262 152 Q 235 145 205 162" stroke="#2a4a20" stroke-width="7" stroke-linecap="round" fill="none"/>

            <!-- Naso -->
            <path d="M 200 190 Q 218 210 208 235 Q 200 242 192 235 Q 182 210 200 190 Z" fill="#5a9048"/>
            <ellipse cx="200" cy="233" rx="12" ry="6" fill="#3f6b32"/>
            <ellipse cx="194" cy="236" rx="3" ry="2.5" fill="#1a1a1a"/>
            <ellipse cx="206" cy="236" rx="3" ry="2.5" fill="#1a1a1a"/>

            <!-- Bocca -->
            <path d="M 160 265 Q 200 292 240 265 Q 200 282 160 265 Z" fill="#2a1a1a"/>
            <path d="M 172 265 L 168 282 L 182 272 Z" fill="#f5f5dc"/>
            <path d="M 228 265 L 232 282 L 218 272 Z" fill="#f5f5dc"/>

            <!-- Verruche -->
            <circle cx="140" cy="220" r="4.5" fill="#5a9048"/>
            <circle cx="145" cy="218" r="2" fill="#3f6b32" opacity="0.5"/>
            <circle cx="260" cy="235" r="5" fill="#5a9048"/>
            <circle cx="258" cy="233" r="2" fill="#3f6b32" opacity="0.5"/>
            <circle cx="230" cy="128" r="3.5" fill="#5a9048"/>
            <circle cx="168" cy="130" r="3" fill="#5a9048"/>

            <!-- Cicatrice -->
            <path d="M 245 148 L 262 172" stroke="#3f6b32" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round"/>
            <path d="M 248 155 L 258 153" stroke="#3f6b32" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
            <path d="M 250 163 L 261 161" stroke="#3f6b32" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="title">Goblin Corrotto</div>
  </div>
</body>
</html>
