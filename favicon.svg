<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="50%" stop-color="#1a1a3a"/>
      <stop offset="100%" stop-color="#0f0f28"/>
    </linearGradient>
    <radialGradient id="manaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ad8ff" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#7ad8ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7ad8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Carta: quasi tutto il viewBox -->
  <rect x="5" y="2" width="54" height="60" rx="7"
        fill="url(#cardBg)" stroke="#d8a840" stroke-width="3"/>

  <!-- Cornice interna -->
  <rect x="12" y="9" width="40" height="46" rx="3"
        fill="none" stroke="#d8a840" stroke-width="1.2" opacity="0.5"/>

  <!-- Glow mana grande -->
  <circle cx="32" cy="32" r="20" fill="url(#manaGlow)"/>

  <!-- Diamante di mana (ingrandito) -->
  <path d="M32 15 L43 32 L32 49 L21 32 Z"
        fill="#7ad8ff" stroke="#e8f4ff" stroke-width="1"/>
  <path d="M32 15 L43 32 L32 32 Z" fill="#e8f4ff" opacity="0.85"/>
  <path d="M32 32 L32 49 L21 32 Z" fill="#4a9ec8" opacity="0.6"/>

  <!-- Borchie angoli (ingrandite) -->
  <circle cx="12" cy="10" r="2" fill="#d8a840"/>
  <circle cx="52" cy="10" r="2" fill="#d8a840"/>
  <circle cx="12" cy="54" r="2" fill="#d8a840"/>
  <circle cx="52" cy="54" r="2" fill="#d8a840"/>
</svg>
