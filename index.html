<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Deckbuilder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Kalam:wght@400;700&family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-table" id="game-table">

        <div class="player-side">
            <div class="player-ui">
                <div class="entity-name">Eroe (Tu)</div>
                <div class="health-bar-container">
                    <div class="health-bar-fill" id="player-hp-bar" style="width: 100%;"></div>
                    <div class="health-text"><span><span id="player-hp">75</span> / <span id="player-max-hp">75</span> ❤️<span id="shield-display"></span></span></div>
                </div>
                <div class="stats-row">
                    <div class="stat-item">💎 Mana: <span id="mana-current">3</span> / <span id="mana-max">3</span></div>
                    <div class="stat-item" id="player-strength" style="display: none;"></div>
                    <div class="stat-item" id="player-weak" style="display: none;"></div>
                    <div class="stat-item" id="player-regen" style="display: none;"></div>
                </div>
            </div>
            <div class="player-bonuses" id="player-bonuses" style="display: none;"></div>
        </div>

        <div class="top-center-ui">
            <button class="icon-btn" id="open-menu-btn" title="Menu">☰</button>
            <button class="icon-btn" id="open-deck-btn" title="Mazzo">📜<span class="icon-badge" id="deck-count">0</span></button>
            <button class="icon-btn" id="open-equip-btn" title="Equipaggiamento">📦<span class="icon-badge" id="equip-unseen-count" style="display: none;">0</span></button>
            <button class="icon-btn" id="open-map-btn" title="Mappa">🗺️</button>
        </div>

        <div class="monster-ui">
            <div class="entity-name">Goblin Corrotto</div>
            <div class="health-bar-container">
                <div class="health-bar-fill" id="monster-hp-bar" style="width: 100%;"></div>
                <div class="health-text"><span><span id="monster-hp">50</span> / <span id="monster-max-hp">50</span> ❤️<span id="monster-shield-display"></span></span></div>
            </div>
            <div class="stats-row">
                <div class="stat-item" id="monster-intent">⚔️ Intento: 6 Danni</div>
                <div class="stat-item" id="monster-burn" style="display: none;"></div>
                <div class="stat-item" id="monster-poison" style="display: none;"></div>
                <div class="stat-item" id="monster-weak" style="display: none;"></div>
                <div class="stat-item" id="monster-stun" style="display: none;"></div>
            </div>
        </div>

        <div class="fx-vignette" id="fx-vignette"></div>
        <div class="fx-layer" id="fx-layer"></div>
        <div class="turn-banner" id="turn-banner"></div>
        <div class="hand-container" id="hand"></div>
    </div>

    <div class="modal-overlay" id="deck-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Carte nel Mazzo</span>
                <button class="modal-close-btn" id="close-deck-btn">&times;</button>
            </div>
            <div class="deck-grid" id="deck-grid"></div>
        </div>
    </div>

    <div class="modal-overlay battle-drop-modal" id="battle-drop-modal">
        <div class="drop-stage" id="battle-drop-stage"></div>
    </div>

    <div class="tooltip-popup" id="tooltip-popup"></div>

    <video class="bg-loop" id="bg-video" autoplay muted loop playsinline preload="auto">
        <source id="bg-video-source" src="bg-goblin.webm" type="video/webm">
    </video>

    <div class="menu-overlay" id="menu-overlay">
        <video class="menu-bg" id="menu-bg-video" autoplay muted loop playsinline preload="auto">
            <source id="menu-bg-source" src="bg-menu.webm" type="video/webm">
        </video>
        <div class="menu-panel" id="menu-panel">
            <button class="menu-btn" id="menu-resume">Riprendi Partita</button>
            <button class="menu-btn" id="menu-new">Nuova Partita</button>
            <button class="menu-btn" id="menu-save">Salva Partita</button>
            <button class="menu-btn" id="menu-load">Carica Partita</button>
            <button class="menu-btn menu-btn-exit" id="menu-exit">Esci da Gioco</button>
        </div>
        <div class="menu-submodal" id="menu-submodal">
            <div class="menu-submodal-content" id="menu-submodal-content"></div>
        </div>
    </div>

    <script src="js/loot.js"></script>
    <script src="js/save.js"></script>
    <script src="js/data.js"></script>
    <script src="js/fx-utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
